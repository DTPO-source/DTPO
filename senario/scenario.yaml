db:
  db_author: aodt_one_ue_cir
  db_host: clickhouse
  db_port: 9000
  opt_in_tables:
  - raypaths
  - cfrs
  - cirs
  opt_in_tables_options:
    raypaths: full
  parquet_export:
    compression: zstd
    iceberg:
      catalog_name: default
      catalog_type: rest
      catalog_uri: http://nessie:19120/iceberg
      nessie_ref: main
    max_workers: 2
    s3_configs:
    - access_key: "${MINIO_ACCESS_KEY}"
      bucket: aerial-data
      endpoint_url: http://minio:9000
      nodes:
      - node1
      provider: minio
      region: us-east-1
      secret_key: "${MINIO_SECRET_KEY}"
      use_ssl: false
    timesteps_per_file: 100
    verify_exports: true
  s3_config:
    access_key: "${MINIO_ACCESS_KEY}"
    bucket: aerial-data
    endpoint_url: http://minio:9000
    provider: minio
    region: us-east-1
    secret_key: "${MINIO_SECRET_KEY}"
  sim_id: demo
gis:
  scene:
    scene_url: demo_gis/demo
  vegetation:
    active: true
    geojson:
    - demo_gis/demo/sim/vegetation_demo.geojson
    vegetation_asset_path:
    - test_data/assets/street_tree.json
sim:
  DUs:
    add:
    - id: 1
      position:
        pos:
          x: 0.0
          'y': 0.0
          z: 100.0
    default: test_data/assets/du.json
    update:
    - attributes:
        aerial_du_fft_size: 4096
        aerial_du_max_channel_bandwidth: 100.0
        aerial_du_num_antennas: 4
        aerial_du_reference_freq: 3489.42
        aerial_du_subcarrier_spacing: 30.0
      ids:
      - 1
  Materials:
    default: test_data/assets/materials.json
  Panels:
    add:
    - id: 1
    - id: 2
    default: test_data/assets/panel.json
    update:
    - attributes:
        antenna_names:
        - isotropic
        antenna_roll_angle_first_polz_degree: 0.0
        antenna_roll_angle_second_polz_degree: 90.0
        antenna_spacing_horz_mm: 42.95734792601636
        antenna_spacing_vert_mm: 42.95734792601636
        dual_polarized: true
        num_loc_antenna_horz: 2
        num_loc_antenna_vert: 1
        reference_freq_mhz: 3489.42
      ids:
      - 1
    - attributes:
        antenna_names:
        - isotropic
        antenna_roll_angle_first_polz_degree: 0.0
        antenna_roll_angle_second_polz_degree: 90.0
        antenna_spacing_horz_mm: 42.95734792601636
        antenna_spacing_vert_mm: 42.95734792601636
        dual_polarized: true
        num_loc_antenna_horz: 2
        num_loc_antenna_vert: 1
        reference_freq_mhz: 3489.42
      ids:
      - 2
  RUs:
    add:
    - id: 1
      position:
        pos:
          lat: 42.72346
          lon: -84.48013
    default: test_data/assets/gnb.json
    update:
    - attributes:
        aerial_gnb_carrier_freq: 3489.42
        aerial_gnb_du_id: 1
        aerial_gnb_du_manual_assign: true
        aerial_gnb_height: 1.0
        aerial_gnb_mech_azimuth: 6.11912358392363
        aerial_gnb_mech_tilt: 0.0
        aerial_gnb_panel_type: 2
        aerial_gnb_radiated_power: 80.0
      ids:
      - 1
  Scatterers:
    default: test_data/assets/car_small.json
  Scenario:
    default: test_data/assets/scenario.json
    update:
    - attributes:
        sim_batches: 1
        sim_duration: 1405.0
        sim_em_diffuse_type: 0
        sim_em_fast_mode: false
        sim_em_interactions: 5
        sim_em_max_num_paths_per_ant_pair: 1000
        sim_em_rays: 1000
        sim_enable_wideband: true
        sim_gnb_panel_type: 2
        sim_interval: 1.5
        sim_is_full: false
        sim_is_seeded: true
        sim_samples_per_slot: 1
        sim_seed: 1
        sim_simulation_mode: 0
        sim_slots_per_batch: 0
        sim_ue_panel_type: 1
  UEs:
    add:
    - gpx:
        src: demo_gis/demo/sim/ue_trajectory_1p5s.gpx
        use_pathfinding: false
      id: 1
    default: test_data/assets/ue.json
    update:
    - attributes:
        aerial_ue_bler_target: 0.1
        aerial_ue_initial_mech_azimuth: 0.0
        aerial_ue_manual: true
        aerial_ue_mech_tilt: 0.0
        aerial_ue_panel_type: 1
        aerial_ue_radiated_power: 23.0
      ids:
      - 1
  VegetationMaterials:
    default: test_data/assets/vegetation_materials.json
